<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Music video</title>
<!-- Imagination Studio motion graphics: clips cut on the beat of a song, with flash and whip cuts. The studio adds one
     wrapper per shot (#shot0 …, each holding its clip timed to its beats) and the song, and writes data.js. -->
<script src="gsap.min.js"></script>
<script src="data.js"></script>
<style>
  @font-face { font-family: "Instrument Serif"; src: url("fonts/instrument-serif.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Geist"; src: url("fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #000; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; --u: 1px; }
  .shot { position: absolute; inset: 0; overflow: hidden; }
  .shot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #flash { position: absolute; inset: 0; background: #fffaf0; opacity: 0; mix-blend-mode: screen; }
  .titlebox { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 8%; }
  #title { display: block; font-family: "Geist", system-ui, sans-serif; font-weight: 800; font-size: calc(var(--u) * 120); letter-spacing: -0.02em;
    text-transform: uppercase; color: #fff; text-align: center; text-shadow: 0 calc(var(--u) * 4) calc(var(--u) * 30) rgba(0, 0, 0, 0.6); opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080" data-fps="24">
  <!-- studio:media -->
  <div id="flash"></div>
  <div class="titlebox"><span id="title"></span></div>
</div>
<script>
  const D = window.STUDIO_DATA || {}, root = document.getElementById("root");
  const u = Math.min(Number(D.width) || 1920, (Number(D.height) || 1080) * 16 / 9) / 1920;
  root.style.setProperty("--u", u + "px");
  const shots = D.shots || [], how = D.transition || "mixed", dur = Number(D.duration) || 6;
  const tl = gsap.timeline({ paused: true });
  shots.forEach((shot, k) => {
    const id = "#shot" + k, len = shot.end - shot.start;
    // (a later tween on the same target must not draw its start before its time: immediateRender false)
    // every shot settles from a small punch-in over its length
    tl.fromTo(id, { scale: 1.08 }, { scale: 1.0, duration: Math.max(0.1, len), ease: "power2.out" }, shot.start);
    if (!k) return;
    const kind = how === "mixed" ? ["flash", "whip", "cut"][k % 3] : how;
    if (kind === "flash") tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: Math.min(0.3, len * 0.6), ease: "power2.out", immediateRender: false }, shot.start);
    if (kind === "whip") tl.fromTo(id, { xPercent: k % 2 ? 22 : -22, filter: "blur(18px)" }, { xPercent: 0, filter: "blur(0px)", duration: Math.min(0.22, len * 0.5), ease: "power3.out" }, shot.start);
  });
  if (D.title) {
    document.getElementById("title").textContent = D.title;
    tl.fromTo("#title", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 0.2);
    tl.to("#title", { opacity: 0, duration: 0.3, ease: "power2.in" }, Math.min(dur - 0.3, shots[2] ? shots[2].start : 2.5));
  }
  window.__timelines["main"] = tl;
</script>
</body>
</html>
