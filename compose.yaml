# App container. This project is not the container that publishes 8190.
# A still is one prompt to the shared ComfyUI. Do not attach a GPU, and do not publish
# 8188, 8190, 8191, or 8443. Do not start, stop, or unload that server.
name: imagination-studio-app

services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
      args:
        SOURCE_REV: ${SOURCE_REV:-unknown}
    image: imagination-studio-app:${SOURCE_REV:-local}
    ports:
      # This machine, as requested: 192.168.50.22:7870. 127.0.0.1 stays for this computer.
      # There is no login. Not 0.0.0.0, and not 8188, 8190, 8191, or 8443.
      - "127.0.0.1:${STUDIO_PORT:-7870}:7870"
      - "192.168.50.22:${STUDIO_PORT:-7870}:7870"
    environment:
      STUDIO_CONTAINER: "1"
      STUDIO_HOME: /data
      STUDIO_DISCOVER_DELAY: "-1"
      STUDIO_MODE: app-only
      PORT: "7870"
      # Inside the container only, so the published loopback port can reach the app.
      # HOST is unset: 0.0.0.0 would open the LAN with no login.
      STUDIO_BIND: "0.0.0.0"
      STUDIO_COMFY_STATE: /data/comfy
      STUDIO_GPU_LOCK: /data/studio-gpu.lock.d
      STUDIO_STAGED_NODES: /opt/studio/staged-nodes
      # docker0, where the shared server already listens. Not the container's own loopback.
      SDXL_COMFY_URL: "http://172.17.0.1:8188"
      SDXL_CHECKPOINT: /models/sd_xl_turbo_1.0_fp16.safetensors
      # Free space left on the data volume before a job is queued. This is not the 8000 MB RAM floor.
      STUDIO_DISK_RESERVE_BYTES: "1073741824"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - studio-data:/data
      # One checkpoint, read-only. The rest of the shared ComfyUI tree stays unmounted.
      - /home/mcpadmin/ComfyUI/models/checkpoints/sd_xl_turbo_1.0_fp16.safetensors:/models/sd_xl_turbo_1.0_fp16.safetensors:ro
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    # Uvicorn re-raises SIGTERM after the lifespan stops. 20s matches the shutdown test.
    stop_grace_period: 20s
    # Measured app-only on this machine (2026-10-21): 59 MiB RSS, 8 pids, 35% of one
    # core during a 1-second export, 2% idle. The ceiling below is headroom over that run.
    # It does not replace the 8000 MB admission floor, and memswap adds no extra swap.
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 64
    cpus: 1
    restart: "no"

volumes:
  studio-data:
    name: imagination-studio-app-data
